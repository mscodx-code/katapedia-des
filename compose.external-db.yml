services:
  migrate:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
      target: migrate
    container_name: katapedia-migrate-external
    environment:
      DATABASE_URL: ${DATABASE_URL}

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
      target: runner
    container_name: katapedia-api-external
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      SESSION_SECRET: ${SESSION_SECRET}
      STORAGE_PATH: /app/storage
      AI_PROVIDER: ${AI_PROVIDER:-ollama}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL}
      OLLAMA_MODEL: ${OLLAMA_MODEL}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
    ports:
      - "4000:4000"
    volumes:
      - storage_data:/app/storage
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    container_name: katapedia-web-external
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  storage_data:
